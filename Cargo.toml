[package]
name = "http-proxy-server"
version = "2.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
bytes = "1.12"
cached = "4.0.2"
hyper = { version = "1.12", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
getrandom = "0.2"
pem = "3"
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3.55", features = ["std", "macros"] }
tokio = { version = "1.54", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "fs",
    "io-util",
    "time",
    "macros",
] }
tokio-rustls = "0.26"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "local-time"] }
motore = "0.4.1"
http = "1.5"

[dev-dependencies]
x509-parser = "0.16"
